name: Release

on:
  push:
    tags: ["v*"]

# Only the release job may write to the repository; CI stays read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag push also triggers CI, but nothing makes this job wait for it,
      # so re-check here rather than publish an untested binary.
      - run: make test-race
      - run: make vet

      - run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # v1.2.3-rc1 and friends are prereleases; v1.2.3 is not.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*
